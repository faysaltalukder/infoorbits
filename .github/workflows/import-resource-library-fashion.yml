name: One-time Import of Central Resource Library Fashion Images

on:
  push:
    paths:
      - ".github/workflows/import-resource-library-fashion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-fashion-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout InfoOrbit
        uses: actions/checkout@v4

      - name: Download and verify original image files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/resource-library

          download_and_verify() {
            local url="$1"
            local target="$2"
            local expected_sha="$3"

            curl --fail --location --silent --show-error "$url" --output "$target"
            local actual_sha
            actual_sha="$(git hash-object "$target")"

            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "SHA mismatch for $target"
              echo "Expected: $expected_sha"
              echo "Actual:   $actual_sha"
              exit 1
            fi

            echo "Verified $target ($actual_sha)"
          }

          BASE="https://raw.githubusercontent.com/faysaltalukder/Central-resource-library-for-all-website-projects-images/main/pictures/fashion"

          download_and_verify "$BASE/ChatGPT%20Image%20Sep%2012%2C%202026%2C%2005_06_31%20PM.png" "assets/images/resource-library/fashion-01.png" "293be960d7a207c6402d54d0ef3bbb884bb2fd0f"
          download_and_verify "$BASE/ChatGPT%20Image%20Sep%2012%2C%202026%2C%2005_22_12%20PM.png" "assets/images/resource-library/fashion-02.png" "01dea321b3d2c72ece7946cd20c09b83cf6dffe2"
          download_and_verify "$BASE/ChatGPT%20Image%20Sep%2012%2C%202026%2C%2005_22_16%20PM.png" "assets/images/resource-library/fashion-03.png" "d50d52d08d7bb0743c2e09fd155f29017c8065fd"
          download_and_verify "$BASE/ChatGPT%20Image%20Sep%2012%2C%202026%2C%2005_22_22%20PM.png" "assets/images/resource-library/fashion-04.png" "800d345e4b595fd1afd1f3691d55f6657e31fa80"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/resource-library/fashion-01.png assets/images/resource-library/fashion-02.png assets/images/resource-library/fashion-03.png assets/images/resource-library/fashion-04.png
          git commit -m "Add verified fashion images from Central Resource Library"
          git push
